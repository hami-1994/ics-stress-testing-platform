# docker-compose.yml — ICS Security Stress Testing Platform
#
# 使用情境：使用者在 Kali VM 上用 Docker 執行壓力測試平台，
# 攻擊流量路徑：Docker 容器 → Kali VM 主機網路 → 實體網卡 → 受測設備（標的）
#
# 使用方式：
#   docker compose up -d          # 背景啟動
#   docker compose logs -f        # 查看即時 log
#   docker compose down           # 停止並移除容器
#
# 啟動後在瀏覽器打開：http://<Kali VM IP>:8000

services:
  stress-tool:
    build: .
    container_name: ics-stress-tool

    # ── 網路模式 ──
    # 使用 host 網路模式，原因：
    #   1. Layer 2 測項（EtherCAT、PROFINET、GOOSE）需要直接存取主機的實體網卡
    #   2. Raw socket 操作（SYN Flood 等）在 bridge 模式下會被 NAT 干擾
    #   3. 攻擊流量需要直接走主機的網路堆疊才能正確路由到受測設備
    #   4. 避免 Docker bridge 的 conntrack / iptables 影響封包行為
    network_mode: host

    # ── 權限 ──
    # 壓力測試工具需要 raw socket、封包擷取、網卡操作等特權
    cap_add:
      - NET_RAW       # raw socket（SYN Flood、ICMP、scapy 封包）
      - NET_ADMIN     # 網卡設定、封包擷取（tshark/dumpcap）

    # ── 資料持久化 ──
    # 把 data/ 掛載到主機，即使容器重建也不會遺失專案資料、報告和 CSV
    volumes:
      - ./data:/opt/stress-tool/data

    # ── 環境變數 ──
    environment:
      - STRESS_TOOL_HOST=0.0.0.0
      - STRESS_TOOL_PORT=8000

    # ── 健康檢查 ──
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    restart: unless-stopped
